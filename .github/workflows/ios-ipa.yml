name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/ios-native-app-4afc
      - cursor/ios-watch-app-4afc
      - cursor/ios-watch-bundle-4afc
      - cursor/watch-install-fix-4afc
    paths-ignore:
      - ios/release/**

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Stockea.xcodeproj \
            -scheme Stockea \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            VALIDATE_PRODUCT=NO \
            build

      - name: Pack IPA
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -name 'Stockea.app' -type d | head -n 1)
          test -n "$APP"
          test -d "$APP/Watch/StockeaWatch.app"
          WATCH_BIN="$APP/Watch/StockeaWatch.app/StockeaWatch"
          lipo -info "$APP/Stockea"
          lipo -info "$WATCH_BIN"
          echo "Watch min OS before restamp:"
          xcrun vtool -show-build "$WATCH_BIN"
          # The watchOS 26 SDK marks the arm64 slice as requiring watchOS 26.
          # installd then refuses the app on any watch that is still on an older system,
          # even though the matching slice could run. Stamp both slices at watchOS 10.
          xcrun vtool -set-build-version watchos 10.0 26.5 -replace -output "$WATCH_BIN.restamp" "$WATCH_BIN"
          mv "$WATCH_BIN.restamp" "$WATCH_BIN"
          chmod +x "$WATCH_BIN"
          echo "Watch min OS after restamp:"
          xcrun vtool -show-build "$WATCH_BIN"
          if xcrun vtool -show-build "$WATCH_BIN" | grep -E 'minos 2[6-9]'; then
            echo "watch binary still requires watchOS 26 or newer"
            exit 1
          fi
          lipo -info "$WATCH_BIN" | grep -q arm64
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry Stockea.ipa Payload)
          mkdir -p ios/release
          cp "$RUNNER_TEMP/Stockea.ipa" ios/release/Stockea.ipa
          ls -lh ios/release/Stockea.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Stockea-ipa
          path: ios/release/Stockea.ipa
          if-no-files-found: error
