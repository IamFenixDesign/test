name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/ios-native-app-4afc
      - cursor/ios-watch-app-4afc
      - cursor/ios-watch-bundle-4afc
    paths-ignore:
      - ios/release/**

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Stockea.xcodeproj \
            -scheme Stockea \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            VALIDATE_PRODUCT=NO \
            build

      - name: Pack IPA
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -name 'Stockea.app' -type d | head -n 1)
          test -n "$APP"
          lipo -info "$APP/Stockea"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry Stockea.ipa Payload)
          mkdir -p ios/release
          cp "$RUNNER_TEMP/Stockea.ipa" ios/release/Stockea.ipa
          ls -lh ios/release/Stockea.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Stockea-ipa
          path: ios/release/Stockea.ipa
          if-no-files-found: error
