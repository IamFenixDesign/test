<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=box" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=box" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=box" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0b0d0c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f5ee" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stockea" />
    <meta name="application-name" content="Stockea" />
    <meta
      id="viewport"
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Stockea — Control de stock</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('stockly-theme') === 'light' ? 'light' : 'dark'

      function syncSiteMode() {
        var ua = navigator.userAgent || ''
        var touch = navigator.maxTouchPoints > 0 || 'ontouchend' in document
        // iOS/iPadOS "Solicitar sitio de escritorio" → UA Macintosh + touch
        var iosDesktop = /Macintosh/i.test(ua) && touch
        // Android Chrome "Sitio de escritorio" → Android sin token Mobile
        var androidDesktop = /Android/i.test(ua) && !/Mobile/i.test(ua)
        var desktopSite = iosDesktop || androidDesktop

        var standalone =
          window.navigator.standalone === true ||
          window.matchMedia('(display-mode: standalone)').matches ||
          window.matchMedia('(display-mode: fullscreen)').matches

        var root = document.documentElement
        var meta = document.getElementById('viewport')
        var mobileViewport = 'width=device-width, initial-scale=1.0, viewport-fit=cover'
        var desktopViewport = 'width=1280, initial-scale=1, viewport-fit=cover'

        if (desktopSite) {
          root.classList.add('is-desktop-site')
          root.classList.remove('is-pwa')
          root.classList.remove('is-ios-pwa')
          if (meta) meta.setAttribute('content', desktopViewport)
        } else {
          root.classList.remove('is-desktop-site')
          if (standalone) root.classList.add('is-pwa')
          else root.classList.remove('is-pwa')

          var isIOS =
            /iPad|iPhone|iPod/i.test(ua) ||
            (/Macintosh/i.test(ua) && touch && navigator.maxTouchPoints > 1)
          if (standalone && isIOS) root.classList.add('is-ios-pwa')
          else root.classList.remove('is-ios-pwa')

          if (meta) meta.setAttribute('content', mobileViewport)
        }
      }

      syncSiteMode()
      window.addEventListener('pageshow', syncSiteMode)
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
