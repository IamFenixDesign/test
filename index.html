<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=1.1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=1.1.0" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=1.1.0" />
    <link rel="manifest" href="./manifest.webmanifest?v=1.1.0" />
    <meta name="theme-color" content="#243018" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stockea" />
    <meta name="application-name" content="Stockea" />
    <meta
      id="viewport"
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Stockea — Control de stock</title>
    <style>
      /* Cold start: the iOS/Android system strip is pure black or white.
         Match it so there is no contrasting bar under the home indicator. */
      html.is-login,
      html.is-login body,
      html.is-login #root {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background-color: #000000;
        background-image: linear-gradient(180deg, #243018 0%, #243018 16%, #0b0d0c 92%, #000000 100%);
        background-repeat: no-repeat;
        background-size: 100% 100%;
      }
      html.is-login[data-theme='light'],
      html.is-login[data-theme='light'] body,
      html.is-login[data-theme='light'] #root {
        background-color: #ffffff;
        background-image: linear-gradient(180deg, #d7e7a4 0%, #d7e7a4 16%, #f3f6ee 92%, #ffffff 100%);
      }
    </style>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('stockly-theme') === 'light' ? 'light' : 'dark'
      document.documentElement.classList.add('is-login')

      function setThemeColor(color) {
        var nodes = document.querySelectorAll('meta[name="theme-color"]')
        for (var i = nodes.length - 1; i >= 0; i--) nodes[i].parentNode.removeChild(nodes[i])
        var meta = document.createElement('meta')
        meta.setAttribute('name', 'theme-color')
        meta.setAttribute('content', color)
        document.head.appendChild(meta)
      }

      function syncThemeChrome() {
        var root = document.documentElement
        var login = root.classList.contains('is-login')
        var light = root.dataset.theme === 'light'
        var color = login ? (light ? '#d7e7a4' : '#243018') : light ? '#f2f5ee' : '#0b0d0c'
        setThemeColor(color)
        var appleBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
        if (appleBar) {
          var standalone =
            root.classList.contains('is-pwa') || window.navigator.standalone === true
          appleBar.setAttribute('content', standalone ? 'black-translucent' : 'default')
        }
      }

      syncThemeChrome()
      window.setThemeColor = setThemeColor

      function isIosBrowser() {
        var ua = navigator.userAgent || ''
        return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
      }

      function syncAppHeight() {
        // Safari (pestaña) y la PWA reportan un viewport corto al abrir y a veces
        // no disparan resize. En el teléfono estiramos hasta screen.height cuando
        // la diferencia es la barra de Safari o el home indicator.
        var vv = window.visualViewport
        var vvH = vv ? vv.height + (vv.offsetTop || 0) : 0
        var h = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0, vvH || 0)
        var ua = navigator.userAgent || ''
        var phone = isIosBrowser() || (/Android/i.test(ua) && /Mobile/i.test(ua))
        var screenH = window.screen && window.screen.height ? window.screen.height : 0
        if (phone && screenH > h && screenH - h < 280) h = screenH
        if (h > 0) {
          var px = Math.round(h) + 'px'
          document.documentElement.style.setProperty('--app-height', px)
          if (document.documentElement.classList.contains('is-login')) {
            document.documentElement.style.minHeight = px
            document.body.style.minHeight = px
          }
        }
        syncThemeChrome()
      }

      function kickIOSViewport() {
        if (!isIosBrowser()) return
        var se = document.scrollingElement || document.documentElement
        var y = se.scrollTop || 0
        se.scrollTop = y + 1
        se.scrollTop = y
        syncAppHeight()
      }

      window.syncAppHeight = syncAppHeight
      window.syncThemeChrome = syncThemeChrome

      function syncSiteMode() {
        var ua = navigator.userAgent || ''
        var touch = navigator.maxTouchPoints > 0 || 'ontouchend' in document
        // iOS/iPadOS "Solicitar sitio de escritorio" → UA Macintosh + touch
        var iosDesktop = /Macintosh/i.test(ua) && touch
        // Android Chrome "Sitio de escritorio" → Android sin token Mobile
        var androidDesktop = /Android/i.test(ua) && !/Mobile/i.test(ua)
        var desktopSite = iosDesktop || androidDesktop

        var isCapacitor =
          !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())
        var isAndroidWebView = /Android/i.test(ua) && /; wv\)/i.test(ua)
        var isAndroidApp = isCapacitor || isAndroidWebView

        var standalone =
          isAndroidApp ||
          window.navigator.standalone === true ||
          window.matchMedia('(display-mode: standalone)').matches ||
          window.matchMedia('(display-mode: fullscreen)').matches

        var root = document.documentElement
        if (isIosBrowser()) root.classList.add('is-ios')
        else root.classList.remove('is-ios')
        var meta = document.getElementById('viewport')
        var mobileViewport = 'width=device-width, initial-scale=1.0, viewport-fit=cover'
        var desktopViewport = 'width=1280, initial-scale=1, viewport-fit=cover'

        if (isAndroidApp) root.classList.add('is-android-app')
        else root.classList.remove('is-android-app')

        if (desktopSite && !isAndroidApp) {
          root.classList.add('is-desktop-site')
          root.classList.remove('is-pwa')
          if (meta) meta.setAttribute('content', desktopViewport)
        } else {
          root.classList.remove('is-desktop-site')
          if (standalone) root.classList.add('is-pwa')
          else root.classList.remove('is-pwa')
          if (meta) meta.setAttribute('content', mobileViewport)
        }

        syncAppHeight()
      }

      syncSiteMode()
      syncAppHeight()
      window.addEventListener('pageshow', syncSiteMode)
      document.addEventListener('DOMContentLoaded', syncSiteMode)
      window.addEventListener('capacitorReady', syncSiteMode)
      window.addEventListener('resize', syncAppHeight)
      window.addEventListener('orientationchange', syncAppHeight)
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncAppHeight)
        window.visualViewport.addEventListener('scroll', syncAppHeight)
      }
      window.addEventListener('load', function () {
        kickIOSViewport()
        var n = 0
        var id = setInterval(function () {
          syncAppHeight()
          if (n === 2 || n === 8) kickIOSViewport()
          if (++n > 24) clearInterval(id)
        }, 120)
      })
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          kickIOSViewport()
          syncAppHeight()
        }
      })
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
